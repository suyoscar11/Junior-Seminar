services:
  api:
    build: ./backend
    environment:
      OMNIPOST_ALLOWED_ORIGINS: http://localhost:3000
      OMNIPOST_DATABASE_PATH: /app/data/omnipost.db
      OMNIPOST_UPLOAD_DIR: /app/data/uploads
    volumes:
      - omnipost_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      OMNIPOST_DATABASE_PATH: /app/data/omnipost.db
      OMNIPOST_UPLOAD_DIR: /app/data/uploads
    volumes:
      - omnipost_data:/app/data
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  omnipost_data:

