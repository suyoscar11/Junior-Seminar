    <g transform="translate(990 105)"><rect width="150" height="105" rx="14" fill="#ffffff"/><text x="75" y="48" fill="#168878" font-size="15" font-weight="700">06</text><text x="75" y="76" fill="#17212b" font-size="18" font-weight="700">Track</text></g>
