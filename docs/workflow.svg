    <g transform="translate(246 105)"><rect width="150" height="105" rx="14" fill="#ffffff"/><text x="75" y="48" fill="#168878" font-size="15" font-weight="700">02</text><text x="75" y="76" fill="#17212b" font-size="18" font-weight="700">Adapt</text></g>
    <g transform="translate(432 105)"><rect width="150" height="105" rx="14" fill="#ffffff"/><text x="75" y="48" fill="#168878" font-size="15" font-weight="700">03</text><text x="75" y="76" fill="#17212b" font-size="18" font-weight="700">Review</text></g>
    <g transform="translate(618 105)"><rect width="150" height="105" rx="14" fill="#ffffff"/><text x="75" y="48" fill="#168878" font-size="15" font-weight="700">04</text><text x="75" y="76" fill="#17212b" font-size="18" font-weight="700">Schedule</text></g>
