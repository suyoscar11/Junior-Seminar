  <rect width="1200" height="300" rx="24" fill="#102c3a"/>
  <g fill="#ffffff" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="600" y="54" font-size="24" font-weight="700">One content workflow, tailored to every channel</text>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
